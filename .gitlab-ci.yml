stages:
  - build
  - test
  - release

variables:
  REGISTRY: registry.gitlab.com/joern_schonhoff/dns-healthcheck
  CGO_ENABLED: "0"
  GOOS: linux

# ── build ────────────────────────────────────────────────────────────────────

build:amd64:
  stage: build
  image: golang:1.27.1-alpine3.23@sha256:d9e2f2f07b10cc922da3e80e035c3058810b328d5aef82d2c63680967c5e2ec9
  script:
    - GOARCH=amd64 go build -ldflags="-s -w" -o dns-healthcheck-linux-amd64 .
  artifacts:
    paths:
      - dns-healthcheck-linux-amd64

build:arm64:
  stage: build
  image: golang:1.27.1-alpine3.23@sha256:d9e2f2f07b10cc922da3e80e035c3058810b328d5aef82d2c63680967c5e2ec9
  script:
    - GOARCH=arm64 go build -ldflags="-s -w" -o dns-healthcheck-linux-arm64 .
  artifacts:
    paths:
      - dns-healthcheck-linux-arm64

# ── test ─────────────────────────────────────────────────────────────────────

test:
  stage: test
  image: golang:1.27.1-alpine3.23@sha256:d9e2f2f07b10cc922da3e80e035c3058810b328d5aef82d2c63680967c5e2ec9
  script:
    - go test ./...

# ── release ──────────────────────────────────────────────────────────────────

release:image:
  stage: release
  image: docker:29.8@sha256:eb37f58646a901dc7727cf448cae36daaefaba79de33b5058dab79aa4c04aefb
  services:
    - docker:29.8-dind@sha256:eb37f58646a901dc7727cf448cae36daaefaba79de33b5058dab79aa4c04aefb
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker buildx create --use
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag "$REGISTRY:$CI_COMMIT_TAG" \
        --tag "$REGISTRY:latest" \
        --push .

release:binaries:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  needs:
    - job: build:amd64
      artifacts: true
    - job: build:arm64
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: dns-healthcheck-linux-amd64
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dns-healthcheck-linux-amd64?job=build:amd64"
        - name: dns-healthcheck-linux-arm64
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dns-healthcheck-linux-arm64?job=build:arm64"
