options {
    directory "/var/cache/bind";

    listen-on { any; };
    listen-on-v6 { none; };

    allow-query { any; };
    recursion no;

    // Silence "no TSIG key" noise in logs
    querylog no;
};

zone "example.internal" {
    type master;
    file "/etc/bind/zones/example.internal.zone";
};
